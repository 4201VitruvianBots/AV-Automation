# Publishes "Rolling Announcements" to GitHub Pages:
#   https://4201vitruvianbots.github.io/AV-Automation/
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy Rolling Announcements to Pages

on:
  push:
    branches: [main]
    paths:
      - "Rolling Announcements/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Rolling Announcements"
      - id: deployment
        uses: actions/deploy-pages@v4
