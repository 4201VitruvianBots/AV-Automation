<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rolling Announcements</title>
<!--
  Rolling announcements for an OBS Browser Source.
  All settings are in this page's URL - build it with the link builder (index.html).

  The slides are downloaded from Google once, when the page loads, i.e. when the OBS
  Browser Source is refreshed or its URL is changed.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; inset: 0; background: #000; }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity var(--fade, 600ms) ease-in-out;
  }
  canvas.on { opacity: 1; }
  #msg {
    position: fixed; left: 0; right: 0; bottom: 4vh; text-align: center;
    font: 2.2vh/1.4 system-ui, sans-serif; color: #bbb; white-space: pre-line;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="deck.js"></script>
</head>
<body>
<div id="stage"><canvas id="a"></canvas><canvas id="b"></canvas></div>
<div id="msg"></div>
<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');
  const canvases = [document.getElementById('a'), document.getElementById('b')];

  const cfg = Deck.fromQuery(location.search);
  let deck = null;          // {pdf, slides}
  let playlist = [];        // slides that are actually shown
  let index = 0, front = 0, timer = 0, generation = 0, active = true;

  document.documentElement.style.setProperty('--fade', cfg.fadeMs + 'ms');
  stage.style.background = cfg.background || '#000';

  async function loadSlides() {
    const id = Deck.deckId(cfg.deck);
    if (!id) { msg.textContent = 'No slide deck in the URL - make a link with the link builder (index.html).'; return; }
    for (let attempt = 1; ; attempt++) {
      try {
        deck = await Deck.loadDeck(id);
        playlist = deck.slides.filter((s) => !s.hidden && s.page);
        msg.textContent = playlist.length ? '' : 'This deck has no slides to show.';
        console.log('Deck loaded:', playlist.map((s) => `#${s.n}=${Deck.timing(s, cfg).seconds}s`).join(' '));
        if (playlist.length) show(0);
        return;
      } catch (err) {
        console.warn('Loading slides failed:', err);
        msg.textContent = `Can't load the slides: ${err.message}\nRetrying…`;
        await new Promise((r) => setTimeout(r, Math.min(60000, 5000 * attempt)));
      }
    }
  }

  // Only one render may touch a canvas at a time, so requests are queued;
  // a request that has been superseded by the time its turn comes is dropped.
  let queue = Promise.resolve();
  function show(i) {
    const gen = ++generation;
    clearTimeout(timer);
    queue = queue.then(() => (gen === generation ? draw(i, gen) : null)).catch((e) => console.warn(e));
  }

  async function draw(i, gen) {
    if (!playlist.length) return;
    index = i % playlist.length;
    const slide = playlist[index];
    const started = performance.now();
    const back = canvases[1 - front];
    try { await Deck.render(deck.pdf, slide.page, back, innerWidth, innerHeight); }
    catch (err) { console.warn('Render failed:', err); }
    if (gen !== generation) return;
    back.classList.add('on');
    canvases[front].classList.remove('on');
    front = 1 - front;
    if (active) schedule(slide, started);
  }

  function schedule(slide, started) {
    const ms = Math.max(500, Deck.timing(slide, cfg).seconds * 1000);
    timer = setTimeout(() => show(index + 1), Math.max(0, ms - (performance.now() - started)));
  }

  // OBS: when the scene comes on air, start again from the first slide (no re-download).
  window.addEventListener('obsSourceActiveChanged', (e) => {
    active = !!e.detail.active;
    clearTimeout(timer);
    generation++;
    if (active && playlist.length) show(0);
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (playlist.length && active) show(index); }, 300);
  });

  loadSlides();
})();
</script>
</body>
</html>
